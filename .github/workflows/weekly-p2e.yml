name: Weekly P2E

on:
  schedule:
    # Sunday 00:05 UTC — new week has started; previous week can attest + settle.
    - cron: "5 0 * * 0"
  workflow_dispatch:

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Seal this week
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          NEXT_PUBLIC_LOOPTERNITY_CONTRACT_ADDRESS: "0x66b549F570Fa63e3109B85FD15678c175F1a02c9"
        run: npx tsx scripts/seal-week.ts
      - name: Rank last week
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          NEXT_PUBLIC_LOOPTERNITY_CONTRACT_ADDRESS: "0x66b549F570Fa63e3109B85FD15678c175F1a02c9"
        run: npx tsx scripts/attest-week.ts
      - name: Settle last week
        env:
          PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          NEXT_PUBLIC_LOOPTERNITY_CONTRACT_ADDRESS: "0x66b549F570Fa63e3109B85FD15678c175F1a02c9"
        run: npx tsx scripts/settle-week.ts
