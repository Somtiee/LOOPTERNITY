<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LOOPTERNITY">
  <title>LOOPTERNITY</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2418"/>
      <stop offset="1" stop-color="#04100a"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#ff6a2a" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#ff6a2a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse so both rings share one ramp across the mark. Under the
         default objectBoundingBox each ring would map the whole gradient into
         its own box, and the two would not match where they meet. -->
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="46">
      <stop offset="0" stop-color="#ff9155"/>
      <stop offset="1" stop-color="#ff5a17"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#ground)"/>
  <rect width="64" height="64" rx="15" fill="url(#aura)"/>

  <!-- The two O's of LOOP, linked — the mark reads as LOOP and as ETERNITY at
       once, in the wordmark's own orange.

       Each ring is stroked twice: a ground-coloured casing a little wider than
       the ring, then the ring itself. That casing is the moat keeping two
       same-coloured rings from fusing into a single shape, and it is the only
       thing that survives at 16px — a per-crossing over/under arc would buy a
       true interlace but leave square-cut casing ends at the waist, which read
       as damage in a tab.
       No glow filter here on purpose: a blurred copy of the rings is haze at
       16px, so the warmth comes from the aura behind them instead, which
       scales cleanly from a tab icon to a home-screen tile. -->
  <g>
    <circle cx="41.5" cy="32" r="11.5" fill="none" stroke="#04100a" stroke-width="8.4"/>
    <circle cx="41.5" cy="32" r="11.5" fill="none" stroke="url(#link)" stroke-width="5.6"/>
    <circle cx="22.5" cy="32" r="11.5" fill="none" stroke="#04100a" stroke-width="8.4"/>
    <circle cx="22.5" cy="32" r="11.5" fill="none" stroke="url(#link)" stroke-width="5.6"/>
  </g>

  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#d6f5de" stroke-opacity="0.14"/>
</svg>
